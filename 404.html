<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - UPI Guardian</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#020719; color:#fff; font-family:Arial, sans-serif; text-align:center; }
        .wrap { max-width: 420px; padding: 20px; }
        .icon { width:70px;height:70px;border-radius:18px;background:linear-gradient(135deg,#7135d8,#2188ed);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:30px; }
        h1 { font-size: 22px; margin-bottom: 10px; }
        p { color:#aeb5c8; font-size:14px; margin-bottom: 22px; }
        a.btn { display:inline-block; background:linear-gradient(90deg,#087ff0,#6735e8); color:#fff; text-decoration:none; padding:12px 22px; border-radius:9px; font-size:14px; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="icon"><i class="fa-solid fa-shield-halved"></i></div>
        <h1>404 - Page Not Found</h1>
        <p>The page you're looking for doesn't exist or may have moved.</p>
        <a class="btn" href="/index.html">Back to Home</a>
    </div>
</body>
</html>
